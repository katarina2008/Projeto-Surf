    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🌊</div>

        <nav>
            <ul>
                <li><a href="index.html">início</a></li>
                <li><a href="aulas.html">aulas</a></li>

                <li><a href="galeria.html">galeria</a></li>
                <li><a href="contato.html">contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Equipamentos</h1>

        <p class="subtitulo">
            Alugue os melhores equipamentos para<br>
            curtir seu dia na praia
        </p>

        <section class="equipamentos">

            <div class="card">
                <img src="img/prancha.jpg" alt="Prancha de surf">
                <h3>Prancha de surf</h3>
                <p>R$ 60/dia</p>
                <button>Alugar</button>
            </div>

            <div class="card">
                <img src="img/caiaque.jpg" alt="Caiaque">
                <h3>Caiaque</h3>
                <p>R$ 70/dia</p>
                <button>Alugar</button>
            </div>

            <div class="card">
                <img src="img/cadeira.jpg" alt="Cadeira de praia">
                <h3>Cadeira de praia</h3>
                <p>R$ 20/dia</p>
                <button>Alugar</button>
            </div>

            <div class="card">
                <img src="img/guarda-sol.jpg" alt="Guarda-sol">
                <h3>Guarda-Sol</h3>
                <p>R$ 30/dia</p>
                <button>Alugar</button>
            </div>

            <div class="card">
                <img src="img/paddle.jpg" alt="Stand up paddle">
                <h3>Stand up paddle</h3>
                <p>R$ 70/dia</p>
                <button>Alugar</button>
            </div>

            <div class="card">
                <img src="img/bicicleta.jpg" alt="Bicicleta">
                <h3>Bicicleta</h3>
                <p>R$ 90/dia</p>
                <button>Alugar</button>
            </div>

        </section>
    </main>

    <footer>
        <div class="logo-footer">🌊</div>
        <p>©2026</p>
    </footer>

</body>
</html>
